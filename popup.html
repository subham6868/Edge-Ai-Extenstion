<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edge Eye AI Firewall</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }

    .header {
      background: #0f0f0f;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #6ee7b7, #3b82f6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .header h1 {
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .header p {
      color: #888;
      font-size: 11px;
      margin-top: 1px;
    }

    .site-bar {
      background: #f5f5f5;
      padding: 8px 16px;
      font-size: 11px;
      color: #666;
      border-bottom: 1px solid #e8e8e8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-bar span {
      font-weight: 600;
      color: #333;
    }

    .content {
      padding: 14px 16px;
    }

    .analyze-btn {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .analyze-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .analyze-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results {
      margin-top: 14px;
      display: none;
    }

    .results.visible {
      display: block;
    }

    .findings-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .finding {
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
    }

    .finding.critical {
      background: #fef2f2;
      border-left: 3px solid #ef4444;
      color: #7f1d1d;
    }

    .finding.warning {
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      color: #78350f;
    }

    .finding.safe {
      background: #f0fdf4;
      border-left: 3px solid #22c55e;
      color: #14532d;
    }

    .finding-label {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .finding.critical .finding-label { color: #ef4444; }
    .finding.warning .finding-label { color: #f59e0b; }
    .finding.safe .finding-label { color: #22c55e; }

    .summary-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .summary-box h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .summary-box ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .summary-box ul li {
      font-size: 12px;
      color: #374151;
      padding-left: 14px;
      position: relative;
      line-height: 1.4;
    }

    .summary-box ul li::before {
      content: "→";
      position: absolute;
      left: 0;
      color: #94a3b8;
    }

    .email-btn {
      width: 100%;
      padding: 9px;
      background: white;
      color: #2563eb;
      border: 1.5px solid #2563eb;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }

    .email-btn:hover {
      background: #eff6ff;
    }

    .disclaimer {
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      font-size: 12px;
      color: #7f1d1d;
      display: none;
    }

    .error-box.visible {
      display: block;
    }

    .not-legal-page {
      margin-top: 14px;
      background: #f8fafc;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      display: none;
    }

    .not-legal-page.visible {
      display: block;
    }

    .not-legal-page p {
      margin-top: 6px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🛡️</div>
    <div>
      <h1>Edge Eye AI Firewall</h1>
      <p>AI-powered legal text analysis</p>
    </div>
  </div>

  <div class="site-bar" id="siteBar">Loading page info...</div>

  <div class="content">
    <button class="analyze-btn" id="analyzeBtn">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Analyze Legal Text</span>
    </button>

    <div class="error-box" id="errorBox"></div>
    <div class="not-legal-page" id="notLegalPage">
      <div style="font-size:24px">📄</div>
      <p>This doesn't appear to be a Terms, Privacy Policy, or legal document page. Navigate to such a page and try again.</p>
    </div>

    <div class="results" id="results">
      <div class="findings-list" id="findingsList"></div>
      <div class="summary-box">
        <h3>Plain English Summary</h3>
        <ul id="summaryList"></ul>
      </div>
      <button class="email-btn" id="emailBtn">Generate Fight Back Email</button>
      <div class="disclaimer">AI-assisted analysis only — not legal advice.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
